<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humble Bundle Owned Overlay</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --field: #ffffff;
      --link: #1a73e8;
      --green: #1a9e1a;
      --ok: #137333;
      --err: #c5221f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #3c4043;
        --field: #292a2d;
        --link: #8ab4f8;
        --ok: #81c995;
        --err: #f28b82;
      }
    }

    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    h1 { margin: 0; font-size: 14px; font-weight: 600; }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      margin: 12px 0 14px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; }

    button {
      width: 100%;
      font: inherit;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
    }

    .version { display: block; margin-top: 10px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <h1>Humble Bundle Owned Overlay</h1>

  <dl>
    <dt>Status</dt>
    <dd id="status">Checking...</dd>
    <dt>Games</dt>
    <dd id="game-count">-</dd>
    <dt>Updated</dt>
    <dd id="last-updated">-</dd>
  </dl>

  <button id="open-options" type="button">Open settings</button>
  <span class="version" id="version"></span>

  <script src="popup.js"></script>
</body>
</html>
