<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Library Checker for Humble Bundle settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --field: #ffffff;
      --link: #1a73e8;
      --green: #1a9e1a;
      --ok: #137333;
      --err: #c5221f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #3c4043;
        --field: #292a2d;
        --link: #8ab4f8;
        --ok: #81c995;
        --err: #f28b82;
      }
    }

    body {
      margin: 0;
      padding: 40px 24px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; }

    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }

    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    a { color: var(--link); }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      font: inherit;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .key-row { display: flex; gap: 8px; }
    .key-row input { flex: 1; }

    button {
      font: inherit;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
    }
    #refresh-btn {
      margin-top: 24px;
      color: #fff;
      background: var(--green);
      border-color: var(--green);
      font-weight: 600;
    }
    #refresh-btn:disabled { opacity: 0.6; cursor: default; }

    #cache-info { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
    #status { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
    #status:empty { display: none; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }

    footer {
      margin-top: 40px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Steam Library Checker for Humble Bundle</h1>

    <label for="steam-id">SteamID64</label>
    <input type="text" id="steam-id" placeholder="e.g. 76561198000000000" autocomplete="off" spellcheck="false" maxlength="20" />
    <p class="hint">Find yours on <a href="https://steamid.io" target="_blank" rel="noopener">steamid.io</a>.</p>

    <label for="api-key">Steam Web API key</label>
    <div class="key-row">
      <input type="password" id="api-key" placeholder="Paste your key" autocomplete="off" spellcheck="false" />
      <button id="toggle-key" type="button">Show</button>
    </div>
    <p class="hint">Get one at <a href="https://steamcommunity.com/dev/apikey" target="_blank" rel="noopener">steamcommunity.com/dev/apikey</a>. It isn't saved.</p>

    <button id="refresh-btn" type="button">Fetch library</button>
    <p id="cache-info"></p>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>

    <footer>
      <span id="version"></span> ·
      <a href="https://github.com/Armadyl00/library-checker-for-humble-bundle" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://github.com/Armadyl00/library-checker-for-humble-bundle/issues" target="_blank" rel="noopener">Report a problem</a>
    </footer>
  </main>

  <script src="options.js"></script>
</body>
</html>
