name: Extension checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm run build:zip
      - run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: browser-test-builds
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Armadyl00/humble-owned-overlay'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: browser-test-builds
          path: dist
      - name: Publish versioned browser packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its tag and assets unchanged."
            exit 0
          fi
          assets=("dist/humble-owned-overlay-$tag-chrome.zip" "dist/humble-owned-overlay-$tag-firefox.zip")
          for asset in "${assets[@]}"; do test -f "$asset"; done
          node scripts/release-notes.mjs "$tag" > release-notes.md
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          gh release create "$tag" "${assets[@]}" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
